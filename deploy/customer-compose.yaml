# Deploy this stack INSIDE the customer's infrastructure.
# No database container, volume, or durable filesystem on the application server.
services:
  meeting:
    build:
      context: ..
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:4310:4310"
    environment:
      NODE_ENV: production
      AUTH_MODE: entra
      HOST: 0.0.0.0
      PORT: 4310
      PUBLIC_URL: ${PUBLIC_URL:?Customer HTTPS URL required}
      STORAGE_BACKEND: sharepoint
      SHAREPOINT_SITE_ID: ${SHAREPOINT_SITE_ID:?Customer SharePoint site required}
      SHAREPOINT_LIST_ID: ${SHAREPOINT_LIST_ID:?SharePoint index list required}
      SHAREPOINT_DRIVE_ID: ${SHAREPOINT_DRIVE_ID:?SharePoint document library required}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-de}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Customer Entra tenant required}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?Entra app client ID required}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:?Entra API audience required}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      AI_COMPLETIONS_URL: ${AI_COMPLETIONS_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AUTO_ANALYZE_TRANSCRIPTS: ${AUTO_ANALYZE_TRANSCRIPTS:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_AUTH_HEADER: ${AI_AUTH_HEADER:-authorization}
      ROLEALPHA_MCP_URL: ${ROLEALPHA_MCP_URL:-}
      ROLEALPHA_TENANT_UUID: ${ROLEALPHA_TENANT_UUID:-}
      ROLEALPHA_MCP_TOKEN: ${ROLEALPHA_MCP_TOKEN:-}
      ROLEALPHA_ENTITY_ROUTES: ${ROLEALPHA_ENTITY_ROUTES:-}
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
