name: Dependency Review

# Free for public repositories. It answers one question the other jobs cannot: does THIS pull request add a
# dependency with a known vulnerability, or one whose licence this project cannot accept -- before the merge,
# rather than after Dependabot notices it on main.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Review dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Moderate rather than high: a moderate finding in a package that runs in customers' browsers is a
          # decision somebody should make, not a line in a report nobody opens.
          fail-on-severity: moderate
          # rA Meetings is distributed under its own internal collaboration licence. Strong copyleft (GPL, AGPL)
          # would require the combined work under its terms, and licences with service restrictions of their own
          # (SSPL, BUSL, Elastic) would bind customers beyond ours. scripts/licenses.mjs has the same policy with a
          # reason per licence.
          deny-licenses: >-
            SSPL-1.0, BUSL-1.1, Elastic-2.0,
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later
