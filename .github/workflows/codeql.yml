name: CodeQL

# Free for public repositories, and the only scanner here that reads the code rather than the lockfiles: the ESLint
# guardrails catch the shapes this project decided against, CodeQL catches the ones nobody decided about -- an
# address built from untrusted input, HTML assembled from a transcript, a regular expression that backtracks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Once a week, because a finding can arrive without the code changing: the query packs are updated.
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      # Writing the findings back to the Security tab is the whole point.
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # The generated SPFx bundle is a minified copy of client/ and would report every finding twice.
          config: |
            paths-ignore:
              - spfx/src/generated
              - spfx/lib
              - dist

      # No build step: CodeQL reads TypeScript without one.
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
