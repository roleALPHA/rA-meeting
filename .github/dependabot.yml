version: 2
updates:
  # Actions are pinned to full-length commit SHAs, which only a bot that understands the pin can update. Without
  # this entry the pinning convention silently turns into "we run this year's actions forever".
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # React is pinned to exactly the version this release builds and tests with (docs/technical-deployment.md).
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@types/react*'
        update-types: ['version-update:semver-major']
      # The types follow the Node.js the tools run on (engines in package.json), not the newest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 drops the compiler API that typescript-eslint and tests/i18n.test.ts use.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']

  # The SPFx toolchain moves as one release; a single @microsoft/* bump without the others breaks the build.
  - package-ecosystem: npm
    directory: /spfx
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      spfx:
        patterns: ['@microsoft/*', '@rushstack/*']
    ignore:
      - dependency-name: '@microsoft/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # @microsoft/spfx-web-build-rig pins the heft version its plugins are built for.
      - dependency-name: '@rushstack/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      # The project-local Node.js the SPFx toolchain runs on; SPFx 1.24 supports 22, 24 and 26; this repository uses 22.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
